<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">next-key lock 区间示意图（t 表，c = 5, 10, 15, 20，RR 级别）</text>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
  </defs>

  <!-- 数轴 -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#57606a" stroke-width="2"/>
  <g font-size="15" fill="#24292f" text-anchor="middle">
    <circle cx="160" cy="120" r="7" fill="#1a73e8"/>
    <circle cx="340" cy="120" r="7" fill="#1a73e8"/>
    <circle cx="520" cy="120" r="7" fill="#1a73e8"/>
    <circle cx="700" cy="120" r="7" fill="#1a73e8"/>
    <text x="160" y="100" font-weight="bold">c = 5</text>
    <text x="340" y="100" font-weight="bold">c = 10</text>
    <text x="520" y="100" font-weight="bold">c = 15</text>
    <text x="700" y="100" font-weight="bold">c = 20</text>
    <text x="160" y="146" fill="#57606a" font-size="13">记录</text>
    <text x="340" y="146" fill="#57606a" font-size="13">记录</text>
    <text x="520" y="146" fill="#57606a" font-size="13">记录</text>
    <text x="700" y="146" fill="#57606a" font-size="13">记录</text>
    <text x="250" y="146" fill="#57606a" font-size="13">间隙 (5,10)</text>
    <text x="430" y="146" fill="#57606a" font-size="13">间隙 (10,15)</text>
    <text x="610" y="146" fill="#57606a" font-size="13">间隙 (15,20)</text>
  </g>

  <!-- 三种锁图例说明 -->
  <g font-size="14" fill="#24292f">
    <rect x="80" y="172" width="740" height="86" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="100" y="190" width="18" height="18" fill="#1a73e8"/><text x="128" y="204">记录锁：锁单条索引记录，如 c = 10 这一个点</text>
    <rect x="100" y="224" width="18" height="18" fill="#188038"/><text x="128" y="238">间隙锁 gap lock：锁开区间 (a,b)，只防插入，仅在 RR 生效</text>
    <rect x="480" y="190" width="18" height="18" fill="#d93025"/><text x="508" y="204">next-key lock：前开后闭 (a,b]</text>
    <rect x="480" y="224" width="18" height="18" fill="#b06000"/><text x="508" y="238">加锁基本单位 = next-key lock</text>
  </g>

  <!-- 可视化：where c=10 for update -->
  <text x="80" y="300" font-size="16" font-weight="bold" fill="#24292f">推演：WHERE c = 10 FOR UPDATE（非唯一索引等值命中）</text>

  <!-- 第二层数轴 -->
  <line x1="80" y1="380" x2="820" y2="380" stroke="#57606a" stroke-width="2"/>
  <g font-size="14" fill="#24292f" text-anchor="middle">
    <circle cx="160" cy="380" r="6" fill="#57606a"/>
    <circle cx="340" cy="380" r="6" fill="#1a73e8"/>
    <circle cx="520" cy="380" r="6" fill="#57606a"/>
    <circle cx="700" cy="380" r="6" fill="#57606a"/>
    <text x="160" y="408">5</text><text x="340" y="408" font-weight="bold" fill="#1a73e8">10</text>
    <text x="520" y="408">15</text><text x="700" y="408">20</text>
  </g>

  <!-- next-key lock (5,10] -->
  <line x1="170" y1="340" x2="332" y2="340" stroke="#d93025" stroke-width="4" marker-end="url(#arrowR)"/>
  <circle cx="170" cy="340" r="5" fill="#ffffff" stroke="#d93025" stroke-width="2.5"/>
  <circle cx="332" cy="340" r="5" fill="#d93025"/>
  <text x="250" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#d93025">next-key lock (5,10]</text>

  <!-- gap lock (10,15) -->
  <line x1="350" y1="352" x2="510" y2="352" stroke="#188038" stroke-width="4" marker-end="url(#arrowG)" stroke-dasharray="8,5"/>
  <circle cx="350" cy="352" r="5" fill="#ffffff" stroke="#188038" stroke-width="2.5"/>
  <circle cx="510" cy="352" r="5" fill="#ffffff" stroke="#188038" stroke-width="2.5"/>
  <text x="430" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">gap lock (10,15)</text>

  <!-- 说明 -->
  <g font-size="13.5" fill="#24292f">
    <text x="80" y="452">扫描过程：命中 c=10 → 加 next-key lock (5,10]；继续右扫到第一个不满足的值 c=15 → next-key lock (10,15] 退化为 gap lock (10,15)</text>
    <text x="80" y="476" font-weight="bold" fill="#b06000">最终结果：next-key lock (5,10] ＋ gap lock (10,15)，共护住 (5,15) 区间（不含 15 本身），并回表锁主键记录</text>
    <text x="80" y="504" fill="#57606a">对照：唯一索引等值命中 WHERE id=10 → 退化为记录锁，只锁 id=10 一行（优化 1）</text>
    <text x="80" y="528" fill="#57606a">对照：无索引列 WHERE d=5 → 锁全表所有间隙，等价锁表（原则 2，生产事故高发区）</text>
  </g>
</svg>
