<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#188038"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d93025"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">ReadView 可见性判断流程 与 RC / RR 生成时机</text>

  <!-- 流程图节点 -->
  <rect x="80" y="60" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="250" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">取版本链最新版本的 trx_id</text>

  <line x1="250" y1="104" x2="250" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>

  <polygon points="250,130 400,168 250,206 100,168" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="250" y="164" text-anchor="middle" font-size="12" fill="#24292f">trx_id == creator_trx_id</text>
  <text x="250" y="182" text-anchor="middle" font-size="11" fill="#57606a">（自己改的？）</text>

  <line x1="250" y1="206" x2="250" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="262" y="222" font-size="11" fill="#57606a">否</text>

  <polygon points="250,232 390,268 250,304 110,268" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="250" y="264" text-anchor="middle" font-size="12" fill="#24292f">trx_id &lt; min_trx_id</text>
  <text x="250" y="282" text-anchor="middle" font-size="11" fill="#57606a">（生成前已提交？）</text>

  <line x1="250" y1="304" x2="250" y2="328" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="262" y="322" font-size="11" fill="#57606a">否</text>

  <polygon points="250,330 390,366 250,402 110,366" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="250" y="362" text-anchor="middle" font-size="12" fill="#24292f">trx_id &gt;= max_trx_id</text>
  <text x="250" y="380" text-anchor="middle" font-size="11" fill="#57606a">（之后才开启？）</text>

  <line x1="250" y1="402" x2="250" y2="426" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="262" y="420" font-size="11" fill="#57606a">否</text>

  <polygon points="250,428 390,464 250,500 110,464" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="250" y="460" text-anchor="middle" font-size="12" fill="#24292f">trx_id 在 m_ids 中？</text>
  <text x="250" y="478" text-anchor="middle" font-size="11" fill="#57606a">（仍活跃未提交？）</text>

  <!-- 可见分支 -->
  <line x1="400" y1="168" x2="480" y2="168" stroke="#188038" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#188038">是</text>
  <line x1="390" y1="268" x2="480" y2="268" stroke="#188038" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="435" y="260" text-anchor="middle" font-size="11" fill="#188038">是</text>
  <line x1="390" y1="464" x2="480" y2="464" stroke="#188038" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="435" y="456" text-anchor="middle" font-size="11" fill="#188038">不在</text>
  <rect x="485" y="240" width="130" height="56" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="550" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">可见</text>
  <text x="550" y="283" text-anchor="middle" font-size="11" fill="#57606a">返回此版本</text>

  <!-- 不可见分支 -->
  <line x1="390" y1="366" x2="120" y2="366" stroke="#d93025" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="345" y="356" text-anchor="middle" font-size="11" fill="#d93025">是</text>
  <rect x="60" y="510" width="380" height="40" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="250" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">不可见 → 沿 roll_ptr 找上一版本，重新判断</text>
  <line x1="250" y1="500" x2="250" y2="510" stroke="#d93025" stroke-width="2"/>
  <text x="262" y="508" font-size="11" fill="#d93025">在 m_ids 中亦不可见</text>

  <!-- RC vs RR 对比框 -->
  <rect x="500" y="60" width="370" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="685" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">ReadView 生成时机对比</text>
  <rect x="516" y="98" width="338" height="46" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="530" y="117" font-size="13" font-weight="bold" fill="#1a73e8">READ COMMITTED</text>
  <text x="530" y="135" font-size="12" fill="#24292f">每条语句开始时重建 ReadView</text>
  <rect x="516" y="152" width="338" height="46" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="530" y="171" font-size="13" font-weight="bold" fill="#188038">REPEATABLE READ（默认）</text>
  <text x="530" y="189" font-size="12" fill="#24292f">首次快照读生成一次，之后复用</text>

  <rect x="500" y="320" width="370" height="90" rx="10" fill="#fef7e0" stroke="#b06000"/>
  <text x="685" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">四字段来源（trx_sys 全局事务系统）</text>
  <text x="516" y="368" font-size="12" fill="#24292f">m_ids：活跃读写事务 ID 列表快照</text>
  <text x="516" y="387" font-size="12" fill="#24292f">min_trx_id = m_ids 最小值；creator = 本事务</text>
  <text x="516" y="404" font-size="12" fill="#24292f">max_trx_id = 下一个待分配 ID（非最大值）</text>

  <rect x="500" y="428" width="370" height="60" rx="10" fill="#fce8e6" stroke="#d93025"/>
  <text x="516" y="452" font-size="12" font-weight="bold" fill="#d93025">走到链尾仍不可见</text>
  <text x="516" y="472" font-size="12" fill="#24292f">= 本事务看不到这一行（范围扫描表现为不存在）</text>
</svg>
