<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d93025"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#188038"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">MySQL 两段式分层架构：Server 层 → handler API → InnoDB 引擎层</text>

  <!-- 客户端 -->
  <rect x="360" y="52" width="180" height="36" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="75" text-anchor="middle" font-size="14" fill="#24292f">客户端 / 应用程序</text>

  <!-- Server 层 -->
  <rect x="40" y="110" width="820" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="62" y="134" font-size="15" font-weight="bold" fill="#1a73e8">Server 层（与引擎无关）</text>

  <g font-size="12" fill="#24292f">
    <rect x="60" y="148" width="108" height="44" rx="6" fill="#ffffff" stroke="#1a73e8"/>
    <text x="114" y="167" text-anchor="middle">连接器</text>
    <text x="114" y="183" text-anchor="middle" font-size="10" fill="#57606a">认证 / 权限</text>

    <rect x="186" y="148" width="108" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-dasharray="4 3"/>
    <text x="240" y="167" text-anchor="middle" fill="#57606a">查询缓存</text>
    <text x="240" y="183" text-anchor="middle" font-size="10" fill="#d93025">8.0 已移除</text>

    <rect x="312" y="148" width="108" height="44" rx="6" fill="#ffffff" stroke="#1a73e8"/>
    <text x="366" y="167" text-anchor="middle">分析器</text>
    <text x="366" y="183" text-anchor="middle" font-size="10" fill="#57606a">词法 / 语法</text>

    <rect x="438" y="148" width="120" height="44" rx="6" fill="#ffffff" stroke="#1a73e8"/>
    <text x="498" y="167" text-anchor="middle">优化器</text>
    <text x="498" y="183" text-anchor="middle" font-size="10" fill="#57606a">选索引 / 定 join 序</text>

    <rect x="576" y="148" width="108" height="44" rx="6" fill="#ffffff" stroke="#1a73e8"/>
    <text x="630" y="167" text-anchor="middle">执行器</text>
    <text x="630" y="183" text-anchor="middle" font-size="10" fill="#57606a">调引擎逐行过滤</text>

    <rect x="702" y="148" width="140" height="44" rx="6" fill="#ffffff" stroke="#188038"/>
    <text x="772" y="167" text-anchor="middle">binlog（Server 层写）</text>
    <text x="772" y="183" text-anchor="middle" font-size="10" fill="#57606a">逻辑日志 · 复制 / 归档</text>
  </g>
  <g stroke="#57606a" marker-end="url(#arrow)">
    <line x1="168" y1="170" x2="184" y2="170"/>
    <line x1="294" y1="170" x2="310" y2="170"/>
    <line x1="420" y1="170" x2="436" y2="170"/>
    <line x1="558" y1="170" x2="634" y2="170" marker-end="none"/>
    <line x1="630" y1="192" x2="630" y2="224" marker-end="url(#arrow)"/>
  </g>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#57606a">SQL 处理链路：连接 → 解析 → 优化 → 执行</text>

  <!-- handler API -->
  <line x1="450" y1="88" x2="450" y2="108" stroke="#57606a" marker-end="url(#arrow)"/>
  <rect x="320" y="262" width="260" height="34" rx="17" fill="#fff8e1" stroke="#b06000" stroke-width="1.5"/>
  <text x="450" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">handler API（ha_index_read / ha_rnd_next，逐行调用）</text>
  <line x1="450" y1="260" x2="450" y2="260" stroke="none"/>
  <line x1="560" y1="262" x2="630" y2="196" stroke="#b06000" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="450" y1="296" x2="450" y2="330" stroke="#b06000" marker-end="url(#arrow)"/>

  <!-- InnoDB 引擎层 -->
  <rect x="40" y="334" width="820" height="270" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="62" y="358" font-size="15" font-weight="bold" fill="#188038">InnoDB 引擎层（事务 / MVCC / 锁 / 索引）</text>

  <!-- 内存结构 -->
  <rect x="60" y="368" width="380" height="216" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="250" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">内存结构（Buffer Pool 为核）</text>

  <rect x="76" y="400" width="348" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="250" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">Buffer Pool（16KB 页缓存，默认 128M，生产 60%-70% 内存）</text>
  <text x="250" y="438" text-anchor="middle" font-size="10" fill="#57606a">LRU 变体 young/old · free list · flush list · 默认 8 instances</text>
  <text x="250" y="451" text-anchor="middle" font-size="10" fill="#57606a">写先改内存脏页，Page Cleaner 异步刷盘</text>

  <rect x="76" y="464" width="168" height="48" rx="6" fill="#fff8e1" stroke="#b06000"/>
  <text x="160" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#b06000">Change Buffer</text>
  <text x="160" y="498" text-anchor="middle" font-size="9.5" fill="#57606a">非唯一二级索引写缓存 max 25%</text>

  <rect x="256" y="464" width="168" height="48" rx="6" fill="#fff8e1" stroke="#b06000"/>
  <text x="340" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#b06000">Adaptive Hash Index</text>
  <text x="340" y="498" text-anchor="middle" font-size="9.5" fill="#57606a">热点等值查询 O(1)，默认 ON</text>

  <rect x="76" y="520" width="348" height="48" rx="6" fill="#fde7e4" stroke="#d93025"/>
  <text x="250" y="538" text-anchor="middle" font-size="11" font-weight="bold" fill="#d93025">Log Buffer（redo 攒批，默认 16M）</text>
  <text x="250" y="554" text-anchor="middle" font-size="9.5" fill="#57606a">innodb_flush_log_at_trx_commit=1 每次 commit fsync</text>

  <!-- 磁盘结构 -->
  <rect x="460" y="368" width="380" height="216" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="650" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">磁盘结构</text>

  <g font-size="11" fill="#24292f">
    <rect x="476" y="400" width="168" height="52" rx="6" fill="#fde7e4" stroke="#d93025"/>
    <text x="560" y="418" text-anchor="middle" font-weight="bold" fill="#d93025">redo log</text>
    <text x="560" y="433" text-anchor="middle" font-size="9.5" fill="#57606a">循环写物理日志</text>
    <text x="560" y="446" text-anchor="middle" font-size="9.5" fill="#57606a">8.0.30+ 默认 100M</text>

    <rect x="656" y="400" width="168" height="52" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="740" y="418" text-anchor="middle" font-weight="bold" fill="#1a73e8">undo 表空间</text>
    <text x="740" y="433" text-anchor="middle" font-size="9.5" fill="#57606a">undo_001/002</text>
    <text x="740" y="446" text-anchor="middle" font-size="9.5" fill="#57606a">回滚 + MVCC 版本链</text>

    <rect x="476" y="462" width="168" height="52" rx="6" fill="#e6f4ea" stroke="#188038"/>
    <text x="560" y="480" text-anchor="middle" font-weight="bold" fill="#188038">独立表空间 .ibd</text>
    <text x="560" y="495" text-anchor="middle" font-size="9.5" fill="#57606a">段→区(64页=1M)→页(16K)→行</text>
    <text x="560" y="508" text-anchor="middle" font-size="9.5" fill="#57606a">ibdata1 系统表空间</text>

    <rect x="656" y="462" width="168" height="52" rx="6" fill="#fff8e1" stroke="#b06000"/>
    <text x="740" y="480" text-anchor="middle" font-weight="bold" fill="#b06000">Doublewrite 双写区</text>
    <text x="740" y="495" text-anchor="middle" font-size="9.5" fill="#57606a">先写副本再写数据文件</text>
    <text x="740" y="508" text-anchor="middle" font-size="9.5" fill="#57606a">解决 partial page write</text>

    <rect x="476" y="524" width="348" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="650" y="542" text-anchor="middle" font-size="11" fill="#24292f">后台线程：Master Thread / Page Cleaner×4 刷脏</text>
    <text x="650" y="558" text-anchor="middle" font-size="9.5" fill="#57606a">IO 线程×4 · Purge×4 回收 undo（长事务导致 history list 膨胀）</text>
  </g>

  <!-- 流向箭头 -->
  <line x1="250" y1="568" x2="250" y2="586" stroke="none"/>
  <path d="M 424 544 C 470 544, 470 426, 474 426" fill="none" stroke="#d93025" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="460" y="500" font-size="10" fill="#d93025">redo 顺序写</text>
  <path d="M 440 440 L 474 480" fill="none" stroke="#188038" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="436" y="472" font-size="10" fill="#188038">脏页刷盘</text>
  <path d="M 656 488 L 646 488" fill="none" stroke="#b06000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="650" y="478" font-size="10" fill="#b06000" text-anchor="end">先副本 </text>
</svg>
