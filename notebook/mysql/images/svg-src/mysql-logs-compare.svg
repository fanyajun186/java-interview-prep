<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73e8"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d93025"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">三大日志对比 + redo log 循环写环形示意</text>

  <!-- redo card -->
  <rect x="30" y="60" width="270" height="290" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <rect x="30" y="60" width="270" height="44" rx="10" fill="#e8f0fe"/>
  <text x="165" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a73e8">redo log</text>
  <text x="48" y="128" font-size="12.5" fill="#24292f">层级：InnoDB 引擎层</text>
  <text x="48" y="152" font-size="12.5" fill="#24292f">类型：<tspan font-weight="bold">物理日志</tspan>（页号+偏移+内容）</text>
  <text x="48" y="176" font-size="12.5" fill="#24292f">用途：崩溃恢复，保证持久性 D</text>
  <text x="48" y="200" font-size="12.5" fill="#24292f">生命周期：循环覆盖写，空间固定</text>
  <line x1="48" y1="214" x2="282" y2="214" stroke="#d0d7de"/>
  <text x="48" y="236" font-size="12" fill="#57606a">关键参数：</text>
  <text x="48" y="256" font-size="12" fill="#57606a">innodb_flush_log_at_trx_commit=1</text>
  <text x="48" y="276" font-size="12" fill="#57606a">innodb_redo_log_capacity（8.0.30+）</text>
  <text x="48" y="296" font-size="12" fill="#57606a">配套：doublewrite 防 partial page</text>
  <text x="48" y="316" font-size="12" fill="#57606a">最小原子单位：MTR</text>
  <text x="48" y="336" font-size="12" fill="#57606a">监控：LSN - Last checkpoint at</text>

  <!-- undo card -->
  <rect x="315" y="60" width="270" height="290" rx="10" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <rect x="315" y="60" width="270" height="44" rx="10" fill="#e6f4ea"/>
  <text x="450" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#188038">undo log</text>
  <text x="333" y="128" font-size="12.5" fill="#24292f">层级：InnoDB 引擎层</text>
  <text x="333" y="152" font-size="12.5" fill="#24292f">类型：<tspan font-weight="bold">逻辑日志</tspan>（如何撤销修改）</text>
  <text x="333" y="176" font-size="12.5" fill="#24292f">用途：回滚（A）+ MVCC 快照读</text>
  <text x="333" y="200" font-size="12.5" fill="#24292f">生命周期：提交后按需 purge 回收</text>
  <line x1="333" y1="214" x2="567" y2="214" stroke="#d0d7de"/>
  <text x="333" y="236" font-size="12" fill="#57606a">结构：128 回滚段 × 1024 undo slot</text>
  <text x="333" y="256" font-size="12" fill="#57606a">并发写事务上限 ≈ 9.8 万</text>
  <text x="333" y="276" font-size="12" fill="#57606a">版本链：DB_ROLL_PTR 指向旧版本</text>
  <text x="333" y="296" font-size="12" fill="#57606a">insert undo 提交即删 / update 保留</text>
  <text x="333" y="316" font-size="12" fill="#57606a">监控：History list length</text>
  <text x="333" y="336" font-size="12" fill="#57606a">风险：长事务阻塞 purge → undo 膨胀</text>

  <!-- binlog card -->
  <rect x="600" y="60" width="270" height="290" rx="10" fill="#ffffff" stroke="#b06000" stroke-width="2"/>
  <rect x="600" y="60" width="270" height="44" rx="10" fill="#fff4e5"/>
  <text x="735" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#b06000">binlog</text>
  <text x="618" y="128" font-size="12.5" fill="#24292f">层级：<tspan font-weight="bold">Server 层</tspan>（全引擎共用）</text>
  <text x="618" y="152" font-size="12.5" fill="#24292f">类型：逻辑日志（SQL / 行镜像）</text>
  <text x="618" y="176" font-size="12.5" fill="#24292f">用途：主从复制 + 时间点恢复 + 审计</text>
  <text x="618" y="200" font-size="12.5" fill="#24292f">生命周期：按大小/时间滚动删除</text>
  <line x1="618" y1="214" x2="852" y2="214" stroke="#d0d7de"/>
  <text x="618" y="236" font-size="12" fill="#57606a">格式：ROW（5.7.7+ 默认）/ STMT / MIXED</text>
  <text x="618" y="256" font-size="12" fill="#57606a">sync_binlog=1（双 1 才不丢）</text>
  <text x="618" y="276" font-size="12" fill="#57606a">binlog_cache_size（大事务溢磁盘）</text>
  <text x="618" y="296" font-size="12" fill="#57606a">组提交：flush→sync→commit</text>
  <text x="618" y="316" font-size="12" fill="#57606a">复制链：dump→IO thread→relay log</text>
  <text x="618" y="336" font-size="12" fill="#57606a">→ SQL thread（8.0 WRITESET 并行）</text>

  <!-- redo ring -->
  <text x="450" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">redo log 循环写（环形 buffer，空间固定，write pos 追上 checkpoint 则阻塞全部更新）</text>

  <g transform="translate(450,495)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#d0d7de" stroke-width="26"/>
    <!-- written region arc -->
    <path d="M 0,-78 A 78,78 0 1 1 -76,17" fill="none" stroke="#1a73e8" stroke-width="26" opacity="0.55"/>
    <path d="M -76,17 A 78,78 0 0 1 -33,-70" fill="none" stroke="#d93025" stroke-width="26" opacity="0.55"/>
    <!-- write pos marker -->
    <line x1="-76" y1="17" x2="-120" y2="32" stroke="#1a73e8" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="-128" y="52" font-size="12.5" font-weight="bold" fill="#1a73e8" text-anchor="middle">write pos</text>
    <text x="-128" y="68" font-size="11" fill="#57606a" text-anchor="middle">redo 写入位置（LSN 递增）</text>
    <!-- checkpoint marker -->
    <line x1="-33" y1="-70" x2="-56" y2="-112" stroke="#d93025" stroke-width="2" marker-end="url(#arr3)"/>
    <text x="-60" y="-122" font-size="12.5" font-weight="bold" fill="#d93025" text-anchor="middle">checkpoint</text>
    <text x="-60" y="-106" font-size="11" fill="#57606a" text-anchor="middle">脏页已刷盘点，之前可覆盖</text>
    <!-- legend -->
    <text x="0" y="-6" text-anchor="middle" font-size="12" fill="#24292f">环形文件</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" fill="#57606a">innodb_redo_log_capacity</text>
  </g>

  <rect x="620" y="420" width="16" height="12" fill="#1a73e8" opacity="0.55"/>
  <text x="642" y="430" font-size="11.5" fill="#57606a">已写 redo、数据页未刷盘（崩溃需前滚）</text>
  <rect x="620" y="442" width="16" height="12" fill="#d93025" opacity="0.55"/>
  <text x="642" y="452" font-size="11.5" fill="#57606a">checkpoint 与 write pos 之间的待覆盖区</text>
  <text x="620" y="480" font-size="11.5" fill="#57606a">write pos 追上 checkpoint：</text>
  <text x="620" y="497" font-size="11.5" fill="#57606a">更新全阻塞，强制刷脏页推进 checkpoint</text>
  <text x="620" y="522" font-size="11.5" fill="#57606a">恢复流程：找 checkpoint → redo 前滚</text>
  <text x="620" y="539" font-size="11.5" fill="#57606a">→ undo 回滚未提交事务</text>
</svg>
