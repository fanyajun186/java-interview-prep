<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d93025"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">InnoDB 16KB 数据页内部结构（Compact 行格式）</text>

  <!-- 页主体：左列纵向堆叠 -->
  <g font-size="12" fill="#24292f">
    <!-- File Header -->
    <rect x="80" y="60" width="300" height="58" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="230" y="82" text-anchor="middle" font-weight="bold" fill="#1a73e8">File Header（38B）</text>
    <text x="230" y="100" text-anchor="middle" font-size="10.5" fill="#57606a">页号 · 前后页指针 PREV/NEXT · 页类型 · 校验和</text>

    <!-- Page Header -->
    <rect x="80" y="118" width="300" height="62" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="230" y="140" text-anchor="middle" font-weight="bold" fill="#1a73e8">Page Header（56B）</text>
    <text x="230" y="158" text-anchor="middle" font-size="10.5" fill="#57606a">记录数 · 空闲起点 · 页层级 · 索引 ID · 最大事务 ID</text>

    <!-- Infimum/Supremum -->
    <rect x="80" y="180" width="300" height="48" fill="#fff8e1" stroke="#b06000" stroke-width="1.5"/>
    <text x="230" y="200" text-anchor="middle" font-weight="bold" fill="#b06000">Infimum / Supremum（虚拟记录）</text>
    <text x="230" y="217" text-anchor="middle" font-size="10.5" fill="#57606a">记录单链表的头 / 尾哨兵</text>

    <!-- User Records -->
    <rect x="80" y="228" width="300" height="118" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
    <text x="230" y="250" text-anchor="middle" font-weight="bold" fill="#188038">User Records（真实行）</text>
    <text x="230" y="268" text-anchor="middle" font-size="10.5" fill="#57606a">按主键升序，next_record(16bit 相对偏移) 串单链表</text>
    <text x="230" y="285" text-anchor="middle" font-size="10.5" fill="#57606a">记录在页内倒序存放</text>
    <rect x="100" y="296" width="260" height="40" rx="4" fill="#ffffff" stroke="#188038"/>
    <text x="230" y="312" text-anchor="middle" font-size="10.5" fill="#24292f">row1 → row2 → row3 → …（按主键序）</text>
    <text x="230" y="328" text-anchor="middle" font-size="10" fill="#57606a">deleted mark 的行由 purge 线程回收</text>

    <!-- Free Space -->
    <rect x="80" y="346" width="300" height="62" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="5 3"/>
    <text x="230" y="372" text-anchor="middle" font-weight="bold" fill="#57606a">Free Space（未使用）</text>
    <text x="230" y="390" text-anchor="middle" font-size="10.5" fill="#57606a">新行从这里向低地址扩展</text>

    <!-- Page Directory -->
    <rect x="80" y="408" width="300" height="62" fill="#fde7e4" stroke="#d93025" stroke-width="1.5"/>
    <text x="230" y="430" text-anchor="middle" font-weight="bold" fill="#d93025">Page Directory（稀疏槽位）</text>
    <text x="230" y="448" text-anchor="middle" font-size="10.5" fill="#57606a">约每 6 条记录一个槽（n_owned 记组内条数）</text>
    <text x="230" y="463" text-anchor="middle" font-size="10.5" fill="#57606a">页内二分定位槽 → 组内链表顺序扫</text>

    <!-- File Trailer -->
    <rect x="80" y="470" width="300" height="50" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="230" y="490" text-anchor="middle" font-weight="bold" fill="#1a73e8">File Trailer（8B）</text>
    <text x="230" y="507" text-anchor="middle" font-size="10.5" fill="#57606a">校验和 + LSN，检测 torn page</text>
  </g>

  <!-- 行格式拆解：右侧 -->
  <text x="610" y="70" font-size="14" font-weight="bold" fill="#24292f">单行记录（Compact）拆解</text>
  <g font-size="10.5">
    <rect x="470" y="82" width="200" height="34" fill="#f6f8fa" stroke="#57606a"/>
    <text x="570" y="103" text-anchor="middle" fill="#24292f">变长字段长度列表（逆序，1-2B/列）</text>

    <rect x="470" y="116" width="200" height="34" fill="#f6f8fa" stroke="#57606a"/>
    <text x="570" y="137" text-anchor="middle" fill="#24292f">NULL 值位图（1B/8 列，NULL 不占数据）</text>

    <rect x="470" y="150" width="200" height="34" fill="#fff8e1" stroke="#b06000"/>
    <text x="570" y="171" text-anchor="middle" fill="#b06000">记录头 5B：next_record / n_owned / 类型等</text>

    <rect x="470" y="184" width="200" height="34" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="570" y="205" text-anchor="middle" fill="#1a73e8">DB_ROW_ID（6B，无主键才生成）</text>

    <rect x="470" y="218" width="200" height="34" fill="#fde7e4" stroke="#d93025"/>
    <text x="570" y="239" text-anchor="middle" fill="#d93025">DB_TRX_ID（6B，最后修改事务 ID）</text>

    <rect x="470" y="252" width="200" height="34" fill="#fde7e4" stroke="#d93025"/>
    <text x="570" y="273" text-anchor="middle" fill="#d93025">DB_ROLL_PTR（7B，指向 undo 上一版本）</text>

    <rect x="470" y="286" width="200" height="40" fill="#e6f4ea" stroke="#188038"/>
    <text x="570" y="310" text-anchor="middle" fill="#188038">真实列数据（按建表顺序）</text>
  </g>
  <text x="570" y="346" text-anchor="middle" font-size="10" fill="#57606a">DB_ROW_ID / DB_TRX_ID / DB_ROLL_PTR 为隐藏列</text>

  <!-- 指针从页指向行 -->
  <line x1="380" y1="300" x2="466" y2="200" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#arrowP)"/>

  <!-- undo 版本链 -->
  <text x="700" y="392" font-size="13" font-weight="bold" fill="#24292f">DB_ROLL_PTR 指向 undo 版本链</text>
  <rect x="480" y="404" width="150" height="42" rx="6" fill="#fde7e4" stroke="#d93025"/>
  <text x="555" y="422" text-anchor="middle" font-size="10.5" fill="#24292f">当前版本（数据页）</text>
  <text x="555" y="437" text-anchor="middle" font-size="9.5" fill="#57606a">TRX_ID=108</text>

  <rect x="668" y="404" width="110" height="42" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="723" y="422" text-anchor="middle" font-size="10.5" fill="#24292f">undo：版本 v2</text>
  <text x="723" y="437" text-anchor="middle" font-size="9.5" fill="#57606a">TRX_ID=105</text>

  <rect x="790" y="404" width="100" height="42" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="840" y="422" text-anchor="middle" font-size="10.5" fill="#24292f">undo：版本 v1</text>
  <text x="840" y="437" text-anchor="middle" font-size="9.5" fill="#57606a">TRX_ID=101</text>

  <line x1="630" y1="425" x2="664" y2="425" stroke="#d93025" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <line x1="778" y1="425" x2="786" y2="425" stroke="#d93025" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="685" y="468" font-size="10" fill="#57606a">ReadView 按 TRX_ID 判断可见版本；purge 在无人引用后回收链尾</text>

  <!-- 溢出说明 -->
  <rect x="80" y="540" width="810" height="80" rx="8" fill="#fff8e1" stroke="#b06000"/>
  <text x="100" y="564" font-size="12" font-weight="bold" fill="#b06000">行溢出（off-page）：一页至少装两条记录 → 单行上限约 8KB（8126B）</text>
  <text x="100" y="586" font-size="11" fill="#24292f">超出后变长列溢出到溢出页（链表串联）：Compact 留 768B 前缀 + 20B 指针；DYNAMIC（5.7 默认）整列溢出只留 20B 指针</text>
  <text x="100" y="606" font-size="11" fill="#57606a">影响：访问溢出列多一次 IO，SELECT * 带大 text 列变慢；DYNAMIC 下只查非溢出列不受影响 → 大字段建议拆表</text>
</svg>
