<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1a73e8"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">MVCC：一行数据的 undo 版本链</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#57606a">数据页存最新版本，历史版本通过 DB_ROLL_PTR 串入 undo log（新 → 旧）</text>

  <!-- 数据页行记录 -->
  <rect x="40" y="120" width="240" height="190" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="160" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">数据页 · 行记录（最新版本）</text>
  <rect x="58" y="160" width="204" height="34" rx="4" fill="#ffffff" stroke="#1a73e8"/>
  <text x="160" y="182" text-anchor="middle" font-size="13" fill="#24292f">DB_TRX_ID = 110</text>
  <rect x="58" y="202" width="204" height="34" rx="4" fill="#ffffff" stroke="#1a73e8"/>
  <text x="160" y="224" text-anchor="middle" font-size="13" fill="#24292f">DB_ROLL_PTR → v3</text>
  <rect x="58" y="244" width="204" height="34" rx="4" fill="#ffffff" stroke="#1a73e8"/>
  <text x="160" y="266" text-anchor="middle" font-size="13" fill="#24292f">user columns: cnt = 5</text>
  <text x="160" y="298" text-anchor="middle" font-size="12" fill="#57606a">聚簇索引原地更新最新版</text>

  <!-- 箭头 行记录 -> v3 -->
  <line x1="280" y1="215" x2="330" y2="215" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="305" y="205" text-anchor="middle" font-size="11" fill="#1a73e8">roll_ptr</text>

  <!-- undo log v3 -->
  <rect x="335" y="120" width="160" height="120" rx="10" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <text x="415" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">undo log v3</text>
  <text x="415" y="168" text-anchor="middle" font-size="12" fill="#24292f">trx_id = 100</text>
  <text x="415" y="188" text-anchor="middle" font-size="12" fill="#24292f">cnt = 4</text>
  <text x="415" y="208" text-anchor="middle" font-size="11" fill="#57606a">roll_ptr → v2</text>

  <line x1="495" y1="180" x2="540" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- undo log v2 -->
  <rect x="545" y="120" width="150" height="120" rx="10" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <text x="620" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">undo log v2</text>
  <text x="620" y="168" text-anchor="middle" font-size="12" fill="#24292f">trx_id = 90</text>
  <text x="620" y="188" text-anchor="middle" font-size="12" fill="#24292f">cnt = 3</text>
  <text x="620" y="208" text-anchor="middle" font-size="11" fill="#57606a">roll_ptr → v1</text>

  <line x1="695" y1="180" x2="740" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- undo log v1 -->
  <rect x="745" y="120" width="120" height="120" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="805" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">undo v1</text>
  <text x="805" y="168" text-anchor="middle" font-size="12" fill="#24292f">trx_id = 60</text>
  <text x="805" y="188" text-anchor="middle" font-size="12" fill="#24292f">cnt = 1</text>
  <text x="805" y="208" text-anchor="middle" font-size="11" fill="#57606a">最早版本</text>

  <!-- 底部说明 -->
  <rect x="40" y="330" width="825" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="355" font-size="13" fill="#24292f">UPDATE 流程：旧行拷入 undo log → 原地改数据页 → DB_ROLL_PTR 指向新 undo 记录</text>
  <text x="56" y="378" font-size="13" fill="#57606a">快照读按 ReadView 从最新版本逐版判断可见性，不可见则沿 roll_ptr 向下找，直到可见或走到链尾</text>
</svg>
