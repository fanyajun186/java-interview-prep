<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d93025"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#188038"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">一条 UPDATE 的完整执行链路（两阶段提交）</text>

  <!-- 泳道 -->
  <rect x="20" y="55" width="860" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="20" y="55" width="200" height="300" rx="8" fill="#e8f0fe" stroke="#d0d7de"/>
  <text x="120" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">Server 层</text>
  <rect x="220" y="55" width="220" height="300" fill="#e6f4ea" stroke="#d0d7de"/>
  <text x="330" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#188038">InnoDB 引擎层</text>
  <rect x="440" y="55" width="220" height="300" fill="#fff4e5" stroke="#d0d7de"/>
  <text x="550" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#b06000">磁盘 / 日志文件</text>
  <rect x="660" y="55" width="220" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="770" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#57606a">说明</text>

  <!-- 步骤框 -->
  <!-- 1 undo -->
  <rect x="240" y="110" width="180" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="330" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">① 写 undo log 旧值</text>
  <text x="330" y="145" text-anchor="middle" font-size="11" fill="#57606a">回滚 + MVCC 版本链</text>
  <!-- 2 buffer pool -->
  <rect x="240" y="176" width="180" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="330" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">② 改 Buffer Pool 数据页</text>
  <text x="330" y="211" text-anchor="middle" font-size="11" fill="#57606a">内存变脏页，异步刷盘</text>
  <!-- 3 redo prepare -->
  <rect x="240" y="242" width="180" height="44" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="330" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">③ redo 落盘：prepare</text>
  <text x="330" y="277" text-anchor="middle" font-size="11" fill="#57606a">引擎层先落盘（WAL）</text>
  <!-- 4 binlog -->
  <rect x="40" y="242" width="160" height="44" rx="6" fill="#ffffff" stroke="#b06000" stroke-width="2"/>
  <text x="120" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">④ binlog 写盘 fsync</text>
  <text x="120" y="277" text-anchor="middle" font-size="11" fill="#57606a">Server 层后落盘</text>
  <!-- 5 redo commit -->
  <rect x="240" y="308" width="180" height="40" rx="6" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <text x="330" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">⑤ redo 标记 commit</text>
  <text x="330" y="340" text-anchor="middle" font-size="11" fill="#57606a">事务提交完成</text>

  <!-- 磁盘框 -->
  <rect x="460" y="110" width="180" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="132" text-anchor="middle" font-size="12" fill="#24292f">undo 段（回滚段内）</text>
  <rect x="460" y="176" width="180" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="198" text-anchor="middle" font-size="12" fill="#24292f">redo log（prepare）</text>
  <rect x="460" y="242" width="180" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="264" text-anchor="middle" font-size="12" fill="#24292f">binlog 文件</text>
  <rect x="460" y="308" width="180" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="330" text-anchor="middle" font-size="12" fill="#24292f">redo log（commit）</text>

  <!-- 箭头 -->
  <line x1="330" y1="154" x2="330" y2="172" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="220" x2="330" y2="238" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="264" x2="204" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M120,286 C120,330 200,328 236,328" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="132" x2="456" y2="127" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="420" y1="264" x2="456" y2="193" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="200" y1="264" x2="456" y2="259" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="420" y1="328" x2="456" y2="325" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 说明列 -->
  <text x="676" y="120" font-size="11" fill="#57606a">两阶段提交：</text>
  <text x="676" y="138" font-size="11" fill="#57606a">③ prepare 锚定，</text>
  <text x="676" y="154" font-size="11" fill="#57606a">④ binlog 为提交判据</text>
  <text x="676" y="186" font-size="11" fill="#57606a">组提交：</text>
  <text x="676" y="202" font-size="11" fill="#57606a">flush → sync → commit</text>
  <text x="676" y="218" font-size="11" fill="#57606a">多事务合并 fsync</text>
  <text x="676" y="252" font-size="11" fill="#57606a">doublewrite：</text>
  <text x="676" y="268" font-size="11" fill="#57606a">脏页刷盘前先写副本</text>
  <text x="676" y="284" font-size="11" fill="#57606a">防 partial page write</text>

  <!-- 崩溃恢复判定 -->
  <rect x="20" y="380" width="860" height="160" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="450" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">崩溃恢复：prepare 事务的两种判定分支</text>

  <rect x="60" y="428" width="200" height="40" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="160" y="453" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#24292f">重启扫描，发现 redo 为 prepare</text>

  <rect x="330" y="424" width="240" height="50" rx="6" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <text x="450" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#188038">分支 A：binlog 完整（按 XID 查到）</text>
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#24292f">→ 提交该事务（redo 标 commit）</text>

  <rect x="330" y="486" width="240" height="44" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="2"/>
  <text x="450" y="504" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d93025">分支 B：binlog 不完整 / 不存在</text>
  <text x="450" y="522" text-anchor="middle" font-size="12" fill="#24292f">→ 用 undo 回滚该事务</text>

  <line x1="260" y1="444" x2="326" y2="444" stroke="#188038" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="260" y1="460" x2="300" y2="508" stroke="#d93025" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <line x1="300" y1="508" x2="326" y2="508" stroke="#d93025" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <text x="600" y="446" font-size="12" fill="#57606a">判据：binlog 是否完整落盘</text>
  <text x="600" y="466" font-size="12" fill="#57606a">目的：主库与 binlog（从库数据源）</text>
  <text x="600" y="484" font-size="12" fill="#57606a">在任意崩溃点保持一致</text>
  <text x="600" y="512" font-size="12" fill="#57606a">反证：先写任一单一日志都会</text>
  <text x="600" y="530" font-size="12" fill="#57606a">在崩溃窗口造成主从不一致</text>
</svg>
