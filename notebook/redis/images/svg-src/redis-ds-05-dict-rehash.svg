<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">dict 渐进式 rehash：两张表 + 一个游标，把一次大迁移摊薄</text>

  <defs>
    <marker id="drB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="drR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
  </defs>

  <!-- dict 结构 -->
  <rect x="40" y="52" width="820" height="46" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">dict { dictht ht[2]　/　long rehashidx（迁移游标，-1 表示未在 rehash）}</text>

  <!-- ht0 -->
  <rect x="40" y="112" width="380" height="176" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="230" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">ht[0]（旧表，只减不增）</text>
  <text x="230" y="156" text-anchor="middle" font-size="11" fill="#57606a">dictht { table / size / sizemask / used }，链地址法解决冲突</text>

  <rect x="60" y="166" width="340" height="24" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="183" font-size="10" fill="#24292f">bucket 0</text>
  <text x="200" y="183" font-size="10" fill="#57606a">→ k1 → k5</text>
  <rect x="60" y="190" width="340" height="24" fill="#e6f4ea" stroke="#188038"/>
  <text x="76" y="207" font-size="10" fill="#24292f">bucket 1</text>
  <text x="200" y="207" font-size="10" fill="#188038">→ k2（已迁移，标记空）</text>
  <rect x="60" y="214" width="340" height="24" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="76" y="231" font-size="10" font-weight="bold" fill="#d93025">bucket 2 ← rehashidx 当前位置</text>
  <text x="290" y="231" font-size="10" fill="#d93025">→ k3 → k7</text>
  <rect x="60" y="238" width="340" height="24" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="255" font-size="10" fill="#24292f">bucket 3</text>
  <text x="200" y="255" font-size="10" fill="#57606a">→ k4</text>
  <rect x="60" y="262" width="340" height="18" fill="#ffffff" stroke="none"/>
  <text x="76" y="275" font-size="10" fill="#57606a">… 后续桶待迁移</text>

  <!-- ht1 -->
  <rect x="480" y="112" width="380" height="176" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="670" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">ht[1]（新表，容量 ≥ 2×used 的最小 2ⁿ）</text>
  <text x="670" y="156" text-anchor="middle" font-size="11" fill="#57606a">新增的 key 一律写这里</text>

  <rect x="500" y="166" width="340" height="24" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="516" y="183" font-size="10" fill="#24292f">bucket 0</text>
  <rect x="500" y="190" width="340" height="24" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="516" y="207" font-size="10" fill="#1a73e8">bucket 1</text>
  <text x="640" y="207" font-size="10" fill="#24292f">→ k2（已迁来）</text>
  <rect x="500" y="214" width="340" height="24" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="516" y="231" font-size="10" fill="#24292f">bucket 2</text>
  <rect x="500" y="238" width="340" height="24" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="516" y="255" font-size="10" fill="#24292f">bucket 3</text>
  <rect x="500" y="262" width="340" height="18" fill="#ffffff" stroke="none"/>
  <text x="516" y="275" font-size="10" fill="#57606a">… 等待 ht[0] 的桶搬过来</text>

  <line x1="424" y1="222" x2="476" y2="202" stroke="#1a73e8" stroke-width="2" marker-end="url(#drB)"/>
  <text x="450" y="192" text-anchor="middle" font-size="10" fill="#1a73e8">迁移</text>

  <!-- 读写规则 -->
  <rect x="40" y="304" width="820" height="132" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="328" font-size="13" font-weight="bold" fill="#24292f">rehash 期间的读写规则（追问必考）</text>

  <rect x="60" y="338" width="250" height="84" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="185" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">查 / 删</text>
  <text x="185" y="380" text-anchor="middle" font-size="11" fill="#24292f">先查 ht[0]，没有再查 ht[1]</text>
  <text x="185" y="400" text-anchor="middle" font-size="11" fill="#57606a">两张表都可能有这个 key</text>
  <text x="185" y="416" text-anchor="middle" font-size="11" fill="#57606a">删哪张就减哪张的 used</text>

  <rect x="330" y="338" width="250" height="84" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="455" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#188038">新增</text>
  <text x="455" y="380" text-anchor="middle" font-size="11" fill="#24292f">只写 ht[1]</text>
  <text x="455" y="400" text-anchor="middle" font-size="11" fill="#57606a">保证 ht[0] 只减不增，</text>
  <text x="455" y="416" text-anchor="middle" font-size="11" fill="#57606a">迁移一定能收敛结束</text>

  <rect x="600" y="338" width="240" height="84" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="720" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">更新</text>
  <text x="720" y="380" text-anchor="middle" font-size="11" fill="#24292f">在哪张表找到就改哪张</text>
  <text x="720" y="400" text-anchor="middle" font-size="11" fill="#57606a">不触发迁移，也不改</text>
  <text x="720" y="416" text-anchor="middle" font-size="11" fill="#57606a">rehashidx 的位置</text>

  <!-- 触发条件 -->
  <rect x="40" y="448" width="820" height="92" rx="8" fill="#fff4e5" stroke="#b06000"/>
  <text x="60" y="472" font-size="13" font-weight="bold" fill="#b06000">触发条件（负载因子 = used / size）</text>
  <text x="60" y="494" font-size="12" fill="#24292f">· 扩容：≥ 1（无 BGSAVE / BGREWRITEAOF 时）</text>
  <text x="60" y="514" font-size="12" fill="#d93025">· 正在 BGSAVE 时放宽到 ≥ 5（dict_force_resize_ratio）：fork 后 COW 共享内存页，此刻扩容会触发海量页复制</text>
  <text x="60" y="532" font-size="12" fill="#24292f">· 缩容：&lt; 0.1 且 size ≥ 4　· 迁移推进：每次增删改查顺带迁 1 个非空桶 + serverCron 定时按时间预算兜底</text>
</svg>
