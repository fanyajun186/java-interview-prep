<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Cluster 故障转移五步：从「联系不上」到「客户端改路由」</text>

  <defs>
    <marker id="dB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="dR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="dG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
  </defs>

  <!-- Step 1 -->
  <rect x="40" y="56" width="820" height="86" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="99" r="20" fill="#1a73e8"/>
  <text x="76" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="112" y="88" font-size="14" font-weight="bold" fill="#24292f">主观下线 PFAIL（各自为政的本地判断）</text>
  <text x="112" y="110" font-size="12" fill="#24292f">某节点发出 ping 后，超过 cluster-node-timeout（默认 15000 ms）仍没收到回复 → 在自己本地把对方标成 PFAIL</text>
  <text x="112" y="130" font-size="12" fill="#57606a">主节点和从节点都可以标 PFAIL，这只是「我怀疑它挂了」，还不能触发任何动作</text>

  <!-- Step 2 -->
  <rect x="40" y="152" width="820" height="104" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="204" r="20" fill="#d93025"/>
  <text x="76" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="112" y="184" font-size="14" font-weight="bold" fill="#24292f">客观下线 FAIL（多数主节点确认）</text>
  <text x="112" y="206" font-size="12" fill="#24292f">PFAIL 通过 gossip 扩散；当「超过半数主节点」都在 NODE_TIMEOUT × 2（默认 30 s）这个</text>
  <text x="112" y="224" font-size="12" fill="#24292f">时间窗口内报告过 PFAIL/FAIL，该节点被升级为 FAIL，并向全网广播 FAIL 消息</text>
  <text x="112" y="244" font-size="12" fill="#57606a">纠正一个常见说法：不是「失联满 2×timeout 才标记 FAIL」，2 倍是失败报告的有效期（TTL），超时未刷新的报告作废</text>

  <!-- Step 3 -->
  <rect x="40" y="266" width="820" height="122" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="327" r="20" fill="#b06000"/>
  <text x="76" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="112" y="298" font-size="14" font-weight="bold" fill="#24292f">从节点竞选新主（Raft 风格，谁数据新谁先开口）</text>
  <text x="112" y="320" font-size="12" fill="#24292f">资格过滤：与主断开超过 (cluster-node-timeout × cluster-replica-validity-factor) + repl-ping-replica-period 的从节点被淘汰，</text>
  <text x="112" y="338" font-size="12" fill="#24292f">该因子默认 10，设为 0 表示永远允许参与选举</text>
  <text x="112" y="358" font-size="12" fill="#24292f">延迟发起：按复制偏移量排名，offset 越大延迟越短（约 500 ms + 随机 0~500 ms + rank × 1000 ms），数据最新的最先生效</text>
  <text x="112" y="378" font-size="12" fill="#57606a">拉票：向全部主节点要票，拿到超过半数主节点票才当选；票只投给当前 epoch，先到先得</text>

  <!-- Step 4 -->
  <rect x="40" y="398" width="820" height="86" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="441" r="20" fill="#188038"/>
  <text x="76" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="112" y="430" font-size="14" font-weight="bold" fill="#24292f">新主接管槽 + 其余从节点改挂</text>
  <text x="112" y="452" font-size="12" fill="#24292f">新主接过旧主的全部槽位，递增 configEpoch 并广播 PONG，全网更新槽映射</text>
  <text x="112" y="472" font-size="12" fill="#24292f">同分片剩下的从节点执行 replicaof 指向新主；旧主复活后也会降级为从节点，并做一次全量同步</text>

  <!-- Step 5 -->
  <rect x="40" y="494" width="820" height="86" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="537" r="20" fill="#1a73e8"/>
  <text x="76" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="112" y="526" font-size="14" font-weight="bold" fill="#24292f">客户端改路由（MOVED 由活着的节点回）</text>
  <text x="112" y="548" font-size="12" fill="#24292f">旧节点进程已死 → 客户端拿到的是连接超时/IOException，不是 MOVED；客户端转问集群里其他存活节点，</text>
  <text x="112" y="568" font-size="12" fill="#24292f">由那个存活节点回 MOVED 指向新主，客户端刷新本地槽映射后重试</text>
</svg>
