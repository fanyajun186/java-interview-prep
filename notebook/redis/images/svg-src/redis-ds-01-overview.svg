<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Redis 编码总览：类型只是外壳，内部按数据规模选编码</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#57606a">小数据优先紧凑编码省内存，超阈值转性能编码；转换单向不可逆</text>

  <defs>
    <marker id="ovA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
  </defs>

  <!-- 表头 -->
  <rect x="40" y="72" width="130" height="36" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="105" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">对外类型</text>
  <rect x="176" y="72" width="230" height="36" fill="#e6f4ea" stroke="#188038"/>
  <text x="291" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">小数据编码（省内存）</text>
  <rect x="412" y="72" width="230" height="36" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="527" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">大数据编码（保性能）</text>
  <rect x="648" y="72" width="212" height="36" fill="#fef7e0" stroke="#b06000"/>
  <text x="754" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">切换阈值（默认）</text>

  <!-- String -->
  <rect x="40" y="112" width="130" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">String</text>
  <text x="105" y="158" text-anchor="middle" font-size="11" fill="#57606a">SDS</text>
  <rect x="176" y="112" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="291" y="136" text-anchor="middle" font-size="12" fill="#188038">int（纯整数）</text>
  <text x="291" y="154" text-anchor="middle" font-size="12" fill="#188038">embstr（≤ 44 字节）</text>
  <rect x="412" y="112" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="140" text-anchor="middle" font-size="12" fill="#1a73e8">raw（&gt; 44 字节）</text>
  <rect x="648" y="112" width="212" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="136" text-anchor="middle" font-size="11" fill="#24292f">long 范围内整数 → int</text>
  <text x="754" y="154" text-anchor="middle" font-size="11" fill="#24292f">44 字节分界 embstr / raw</text>
  <line x1="410" y1="142" x2="406" y2="142" stroke="#d93025" marker-end="url(#ovA)"/>

  <!-- List -->
  <rect x="40" y="176" width="130" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">List</text>
  <text x="105" y="222" text-anchor="middle" font-size="11" fill="#57606a">3.2+ 统一 quicklist</text>
  <rect x="176" y="176" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="291" y="200" text-anchor="middle" font-size="12" fill="#188038">节点内 listpack 紧凑编码</text>
  <text x="291" y="222" text-anchor="middle" font-size="11" fill="#57606a">（7.0 前是 ziplist）</text>
  <rect x="412" y="176" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="200" text-anchor="middle" font-size="12" fill="#1a73e8">链表节点数变多</text>
  <text x="527" y="222" text-anchor="middle" font-size="11" fill="#57606a">单元素超限 → PLAIN 直存</text>
  <rect x="648" y="176" width="212" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="200" text-anchor="middle" font-size="11" fill="#24292f">list-max-listpack-size</text>
  <text x="754" y="218" text-anchor="middle" font-size="11" fill="#24292f">默认 -2 = 单节点 8KB</text>

  <!-- Hash -->
  <rect x="40" y="240" width="130" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">Hash</text>
  <rect x="176" y="240" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="291" y="268" text-anchor="middle" font-size="12" fill="#188038">listpack</text>
  <text x="291" y="286" text-anchor="middle" font-size="11" fill="#57606a">（7.0 前是 ziplist）</text>
  <rect x="412" y="240" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="268" text-anchor="middle" font-size="12" fill="#1a73e8">hashtable（dict）</text>
  <rect x="648" y="240" width="212" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="260" text-anchor="middle" font-size="11" fill="#24292f">hash-max-listpack-entries 128</text>
  <text x="754" y="278" text-anchor="middle" font-size="11" fill="#24292f">hash-max-listpack-value 64B</text>
  <line x1="410" y1="270" x2="406" y2="270" stroke="#d93025" marker-end="url(#ovA)"/>

  <!-- Set -->
  <rect x="40" y="304" width="130" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">Set</text>
  <rect x="176" y="304" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="291" y="326" text-anchor="middle" font-size="12" fill="#188038">intset（全整数）</text>
  <text x="291" y="344" text-anchor="middle" font-size="11" fill="#57606a">listpack（7.2+，少量短串）</text>
  <rect x="412" y="304" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="332" text-anchor="middle" font-size="12" fill="#1a73e8">hashtable（value 为 null）</text>
  <rect x="648" y="304" width="212" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="326" text-anchor="middle" font-size="11" fill="#24292f">set-max-intset-entries 512</text>
  <text x="754" y="344" text-anchor="middle" font-size="11" fill="#24292f">set-max-listpack-entries 128</text>
  <line x1="410" y1="334" x2="406" y2="334" stroke="#d93025" marker-end="url(#ovA)"/>

  <!-- ZSet -->
  <rect x="40" y="368" width="130" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">ZSet</text>
  <rect x="176" y="368" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="291" y="396" text-anchor="middle" font-size="12" fill="#188038">listpack</text>
  <text x="291" y="414" text-anchor="middle" font-size="11" fill="#57606a">（7.0 前是 ziplist）</text>
  <rect x="412" y="368" width="230" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="392" text-anchor="middle" font-size="12" fill="#1a73e8">skiplist + dict 组合</text>
  <text x="527" y="412" text-anchor="middle" font-size="11" fill="#57606a">共享同一份 member sds</text>
  <rect x="648" y="368" width="212" height="60" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="390" text-anchor="middle" font-size="11" fill="#24292f">zset-max-listpack-entries 128</text>
  <text x="754" y="408" text-anchor="middle" font-size="11" fill="#24292f">zset-max-listpack-value 64B</text>
  <line x1="410" y1="398" x2="406" y2="398" stroke="#d93025" marker-end="url(#ovA)"/>

  <!-- Stream -->
  <rect x="40" y="432" width="130" height="52" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">Stream</text>
  <rect x="176" y="432" width="466" height="52" fill="#ffffff" stroke="#d0d7de"/>
  <text x="409" y="456" text-anchor="middle" font-size="12" fill="#24292f">listpack + rax（基数树）+ 消费组 pending list</text>
  <text x="409" y="474" text-anchor="middle" font-size="11" fill="#57606a">独立类型，不属于上面五种的编码切换体系</text>
  <rect x="648" y="432" width="212" height="52" fill="#ffffff" stroke="#d0d7de"/>
  <text x="754" y="462" text-anchor="middle" font-size="11" fill="#57606a">5.0 引入，无编码切换</text>

  <!-- 底部 -->
  <rect x="40" y="500" width="820" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="520" font-size="12" font-weight="bold" fill="#24292f">查编码用 OBJECT ENCODING key</text>
  <text x="60" y="538" font-size="12" fill="#d93025">红线：转换单向不可逆——退化成 raw / hashtable 后再删小也回不去，所以阈值别乱调大</text>
</svg>
