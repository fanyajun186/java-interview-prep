<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Redis Cluster 脑裂：分区后为什么少数派会自己停写</text>

  <defs>
    <marker id="fR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="fG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
    <marker id="fO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b06000"/></marker>
  </defs>

  <!-- 分区前 -->
  <text x="60" y="72" font-size="14" font-weight="bold" fill="#24292f">① 正常态：3 主 3 从，A 与 A′ 同分片</text>

  <rect x="60" y="84" width="800" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="90" y="100" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="135" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M-A</text>
  <rect x="250" y="100" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="295" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M-B</text>
  <rect x="410" y="100" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="455" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M-C</text>
  <rect x="90" y="100" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <rect x="570" y="100" width="80" height="44" rx="6" fill="#fef7e0" stroke="#b06000"/>
  <text x="610" y="127" text-anchor="middle" font-size="13" fill="#b06000">R-A′</text>
  <rect x="660" y="100" width="80" height="44" rx="6" fill="#fef7e0" stroke="#b06000"/>
  <text x="700" y="127" text-anchor="middle" font-size="13" fill="#b06000">R-B′</text>
  <rect x="750" y="100" width="80" height="44" rx="6" fill="#fef7e0" stroke="#b06000"/>
  <text x="790" y="127" text-anchor="middle" font-size="13" fill="#b06000">R-C′</text>

  <!-- 分区后 -->
  <text x="60" y="196" font-size="14" font-weight="bold" fill="#24292f">② 网络分区：A 被隔离成少数派（1 主），B/C/A′/B′/C′ 组成多数派（2 主）</text>

  <line x1="440" y1="212" x2="440" y2="440" stroke="#d93025" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="440" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#d93025">网 络 分 区</text>

  <rect x="60" y="216" width="360" height="216" rx="10" fill="#fce8e6" stroke="#d93025"/>
  <text x="240" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#d93025">少数派分区（1 个主节点，凑不够多数票）</text>
  <rect x="150" y="256" width="120" height="52" rx="8" fill="#ffffff" stroke="#d93025"/>
  <text x="210" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">M-A（旧主）</text>
  <text x="210" y="298" text-anchor="middle" font-size="12" fill="#57606a">仍认为自己持有槽</text>
  <text x="90" y="332" font-size="12" fill="#24292f">· 拿不到多数主节点投票，无法完成任何选举</text>
  <text x="90" y="352" font-size="12" fill="#24292f">· cluster-require-full-coverage yes 且槽不全时，</text>
  <text x="110" y="370" font-size="12" fill="#24292f">本分区直接 CLUSTERDOWN，拒绝写入</text>
  <text x="90" y="392" font-size="12" fill="#24292f">· 若配成 no，旧主仍可写 → 这才是真正的脑裂窗口</text>
  <text x="90" y="414" font-size="12" fill="#24292f">· min-replicas-to-write 可补一刀：从节点全失联时拒写</text>

  <rect x="480" y="216" width="380" height="216" rx="10" fill="#e6f4ea" stroke="#188038"/>
  <text x="670" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">多数派分区（2 个主节点，达到多数）</text>
  <rect x="530" y="256" width="90" height="52" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="575" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">M-B</text>
  <text x="575" y="298" text-anchor="middle" font-size="12" fill="#57606a">投票</text>
  <rect x="640" y="256" width="90" height="52" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="685" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">M-C</text>
  <text x="685" y="298" text-anchor="middle" font-size="12" fill="#57606a">投票</text>
  <rect x="750" y="256" width="90" height="52" rx="8" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <text x="795" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">R-A′</text>
  <text x="795" y="298" text-anchor="middle" font-size="12" fill="#57606a">参选</text>

  <line x1="530" y1="330" x2="770" y2="330" stroke="#188038" marker-end="url(#fG)"/>
  <text x="650" y="322" font-size="11" fill="#188038">2/3 主节点投赞成票</text>

  <text x="510" y="368" font-size="12" fill="#24292f">· A 超过 cluster-node-timeout 未恢复 → 多数派标 FAIL</text>
  <text x="510" y="388" font-size="12" fill="#24292f">· A′ 拿到多数票升为新主，接管 A 的槽</text>
  <text x="510" y="408" font-size="12" fill="#24292f">· 网络恢复后旧主 A 降级为从，清空数据全量同步</text>
  <text x="510" y="428" font-size="12" fill="#d93025">· 分区期间写进旧主的那部分数据，永久丢失</text>

  <!-- 结论 -->
  <rect x="60" y="452" width="800" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="474" font-size="13" font-weight="bold" fill="#24292f">能做的与做不到的</text>
  <text x="76" y="494" font-size="12" fill="#24292f">多数派原则只能挡住「少数派选不出新主」，挡不住「分区恰好对半」和「少数派仍可写」；脑裂数据无法自动合并，只能靠业务补偿</text>
</svg>
