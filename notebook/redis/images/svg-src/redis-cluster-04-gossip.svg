<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Gossip 与主从复制是两套通道：别混为一谈</text>

  <defs>
    <marker id="eB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="eR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="eO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b06000"/></marker>
  </defs>

  <!-- 左：Gossip -->
  <rect x="40" y="56" width="470" height="410" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="275" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a73e8">① Gossip：集群元数据（节点状态 / 槽归属 / 故障标记）</text>
  <text x="275" y="104" text-anchor="middle" font-size="12" fill="#57606a">所有节点双向互 ping，主主 / 主从 / 从从都通信</text>

  <!-- 六个节点 -->
  <circle cx="130" cy="190" r="30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="130" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M1</text>
  <circle cx="275" cy="150" r="30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="275" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M2</text>
  <circle cx="420" cy="190" r="30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="420" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">M3</text>
  <circle cx="130" cy="290" r="30" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <text x="130" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">R1</text>
  <circle cx="275" cy="330" r="30" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <text x="275" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">R2</text>
  <circle cx="420" cy="290" r="30" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <text x="420" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">R3</text>

  <g stroke="#1a73e8" stroke-width="1.4">
    <line x1="160" y1="175" x2="248" y2="160"/>
    <line x1="248" y1="160" x2="392" y2="175"/>
    <line x1="392" y1="205" x2="248" y2="318" stroke-dasharray="4 3"/>
    <line x1="160" y1="205" x2="130" y2="260" stroke-dasharray="4 3"/>
    <line x1="160" y1="285" x2="248" y2="322" stroke-dasharray="4 3"/>
    <line x1="302" y1="322" x2="392" y2="300" stroke-dasharray="4 3"/>
    <line x1="392" y1="205" x2="420" y2="260" stroke-dasharray="4 3"/>
  </g>
  <text x="275" y="392" text-anchor="middle" font-size="12" fill="#24292f">实线 = 主主互 ping　虚线 = 主从 / 从从同样互 ping</text>
  <text x="275" y="412" text-anchor="middle" font-size="12" fill="#24292f">每秒从已知节点里随机挑若干个（默认一批 5 个）</text>
  <text x="275" y="432" text-anchor="middle" font-size="12" fill="#24292f">优先 ping 最久没联系过的那个，不是全量广播</text>
  <text x="275" y="452" text-anchor="middle" font-size="12" fill="#d93025">消息类型：MEET / PING / PONG / FAIL / PUBLISH</text>

  <!-- 右：主从复制 -->
  <rect x="530" y="56" width="330" height="410" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="695" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#b06000">② 主从复制：业务数据（写命令流）</text>
  <text x="695" y="104" text-anchor="middle" font-size="12" fill="#57606a">只有主 → 从，单向，与 Gossip 完全无关</text>

  <rect x="600" y="140" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="695" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">Master（写）</text>
  <text x="695" y="184" text-anchor="middle" font-size="12" fill="#24292f">replication buffer / backlog</text>

  <line x1="695" y1="200" x2="695" y2="242" stroke="#b06000" stroke-width="2" marker-end="url(#eO)"/>
  <text x="710" y="226" font-size="11" fill="#b06000">复制流</text>

  <rect x="560" y="248" width="130" height="48" rx="8" fill="#fef7e0" stroke="#b06000"/>
  <text x="625" y="277" text-anchor="middle" font-size="13" fill="#b06000">Replica 1</text>
  <rect x="710" y="248" width="130" height="48" rx="8" fill="#fef7e0" stroke="#b06000"/>
  <text x="775" y="277" text-anchor="middle" font-size="13" fill="#b06000">Replica 2</text>

  <rect x="556" y="320" width="278" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="572" y="344" font-size="12" font-weight="bold" fill="#24292f">从节点每秒回 REPLCONF ACK &lt;offset&gt;</text>
  <text x="572" y="366" font-size="12" fill="#24292f">主节点据此判断「从落后多少」</text>
  <text x="572" y="388" font-size="12" fill="#24292f">offset 差 = 主从数据差（字节）</text>
  <text x="572" y="410" font-size="12" fill="#24292f">只有写命令会让 offset 增长</text>
  <text x="572" y="432" font-size="12" fill="#24292f">读命令不产生复制流</text>

  <!-- 底部权限表 -->
  <rect x="40" y="482" width="820" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="504" font-size="13" font-weight="bold" fill="#24292f">权限区分（高频追问）</text>
  <text x="60" y="526" font-size="12" fill="#188038">收发 Gossip：所有节点（主 + 从）</text>
  <text x="290" y="526" font-size="12" fill="#d93025">判定 FAIL 的投票：仅主节点</text>
  <text x="530" y="526" font-size="12" fill="#b06000">发起并参选新主：仅该分片的从节点</text>
</svg>
