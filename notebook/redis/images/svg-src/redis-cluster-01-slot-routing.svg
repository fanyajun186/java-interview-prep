<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Redis Cluster 寻址：CRC16(key) &amp; 16383 → 槽 → 节点</text>

  <defs>
    <marker id="bB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="bR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="bG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
    <marker id="bO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b06000"/></marker>
  </defs>

  <!-- 第一行：计算 -->
  <rect x="40" y="56" width="820" height="90" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="84" font-size="14" font-weight="bold" fill="#24292f">① 计算槽位（客户端本地算，不问服务端）</text>

  <rect x="70" y="98" width="110" height="34" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="125" y="120" text-anchor="middle" font-size="14" fill="#1a73e8">key = user:100</text>
  <line x1="184" y1="115" x2="214" y2="115" stroke="#1a73e8" marker-end="url(#bB)"/>

  <rect x="218" y="98" width="120" height="34" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="278" y="120" text-anchor="middle" font-size="14" fill="#24292f">CRC16(key)</text>
  <line x1="342" y1="115" x2="372" y2="115" stroke="#1a73e8" marker-end="url(#bB)"/>

  <rect x="376" y="98" width="140" height="34" rx="6" fill="#fff4e5" stroke="#b06000"/>
  <text x="446" y="120" text-anchor="middle" font-size="13" fill="#b06000">按位与 16383</text>
  <line x1="520" y1="115" x2="540" y2="115" stroke="#b06000" marker-end="url(#bO)"/>

  <rect x="544" y="98" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="599" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">slot = 3345</text>

  <text x="670" y="112" font-size="12" fill="#57606a">HashTag：{order}1001</text>
  <text x="672" y="128" font-size="12" fill="#57606a">只对花括号内做 CRC16</text>

  <!-- 槽带 -->
  <text x="60" y="178" font-size="14" font-weight="bold" fill="#24292f">② 16384 个槽按区间分给主节点（不是一致性哈希）</text>

  <rect x="60" y="192" width="252" height="40" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="186" y="217" text-anchor="middle" font-size="13" fill="#1a73e8">0 ~ 5460</text>
  <rect x="312" y="192" width="252" height="40" fill="#fef7e0" stroke="#b06000"/>
  <text x="438" y="217" text-anchor="middle" font-size="13" fill="#b06000">5461 ~ 10922</text>
  <rect x="564" y="192" width="252" height="40" fill="#e6f4ea" stroke="#188038"/>
  <text x="690" y="217" text-anchor="middle" font-size="13" fill="#188038">10923 ~ 16383</text>

  <line x1="60" y1="192" x2="60" y2="182" stroke="#57606a"/>
  <line x1="816" y1="192" x2="816" y2="182" stroke="#57606a"/>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#57606a">0</text>
  <text x="816" y="180" text-anchor="middle" font-size="11" fill="#57606a">16383</text>

  <!-- 三个 master -->
  <rect x="60" y="256" width="252" height="72" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="186" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">Master A（命中）</text>
  <text x="186" y="300" text-anchor="middle" font-size="12" fill="#24292f">slot 3345 归它管</text>
  <text x="186" y="318" text-anchor="middle" font-size="12" fill="#57606a">replica: A′（异步复制）</text>

  <rect x="312" y="256" width="252" height="72" rx="8" fill="#ffffff" stroke="#b06000"/>
  <text x="438" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">Master B</text>
  <text x="438" y="300" text-anchor="middle" font-size="12" fill="#24292f">slot 5461 ~ 10922</text>
  <text x="438" y="318" text-anchor="middle" font-size="12" fill="#57606a">replica: B′</text>

  <rect x="564" y="256" width="252" height="72" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="690" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">Master C</text>
  <text x="690" y="300" text-anchor="middle" font-size="12" fill="#24292f">slot 10923 ~ 16383</text>
  <text x="690" y="318" text-anchor="middle" font-size="12" fill="#57606a">replica: C′</text>

  <!-- 客户端 -->
  <rect x="40" y="352" width="820" height="216" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="378" font-size="14" font-weight="bold" fill="#24292f">③ 客户端（Smart Client）拿着本地「槽 → 节点」映射表直连</text>

  <rect x="60" y="392" width="180" height="60" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="150" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">本地缓存</text>
  <text x="150" y="436" text-anchor="middle" font-size="12" fill="#57606a">slot → ip:port</text>

  <line x1="244" y1="412" x2="290" y2="412" stroke="#188038" marker-end="url(#bG)"/>
  <text x="267" y="404" text-anchor="middle" font-size="11" fill="#188038">命中</text>

  <rect x="294" y="392" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="369" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">直连 Master A</text>
  <text x="369" y="436" text-anchor="middle" font-size="12" fill="#188038">99% 请求走这条路</text>

  <rect x="470" y="392" width="180" height="60" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="560" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">MOVED slot ip:port</text>
  <text x="560" y="436" text-anchor="middle" font-size="12" fill="#d93025">更新本地映射后重试</text>

  <rect x="676" y="392" width="164" height="60" rx="8" fill="#fff4e5" stroke="#b06000"/>
  <text x="758" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">ASK slot ip:port</text>
  <text x="758" y="436" text-anchor="middle" font-size="12" fill="#b06000">临时跳转，不改缓存</text>

  <rect x="60" y="470" width="780" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="494" font-size="13" font-weight="bold" fill="#24292f">映射表从哪来 / 何时变</text>
  <text x="76" y="516" font-size="12" fill="#24292f">· 初始化：CLUSTER SLOTS / CLUSTER NODES 全量拉取</text>
  <text x="76" y="534" font-size="12" fill="#24292f">· MOVED：槽归属已永久变更（迁移完成、主从切换）→ 刷新缓存</text>
  <text x="470" y="516" font-size="12" fill="#24292f">· ASK：槽还在源节点、只有部分 key 搬走 → 单次跳转，不刷新</text>
  <text x="470" y="534" font-size="12" fill="#24292f">· 跳前必须先发 ASKING，否则目标节点回 MOVED 打回源节点</text>
</svg>
