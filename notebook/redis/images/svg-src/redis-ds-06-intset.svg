<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">intset：全整数小集合的紧凑编码，只升不降</text>

  <defs>
    <marker id="isR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
    <marker id="isB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
  </defs>

  <!-- 结构 -->
  <text x="60" y="66" font-size="14" font-weight="bold" fill="#24292f">① 结构</text>

  <rect x="60" y="78" width="200" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="160" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">encoding</text>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#57606a">每个元素占几字节</text>

  <rect x="268" y="78" width="180" height="56" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="358" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">length</text>
  <text x="358" y="122" text-anchor="middle" font-size="11" fill="#57606a">元素个数</text>

  <rect x="456" y="78" width="404" height="56" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="658" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">contents[]</text>
  <text x="658" y="122" text-anchor="middle" font-size="11" fill="#57606a">严格升序、无重复 → 查找走二分 O(log n)</text>

  <!-- 三种编码 -->
  <rect x="60" y="146" width="800" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="168" font-size="12" font-weight="bold" fill="#24292f">encoding 取值</text>
  <rect x="160" y="156" width="100" height="34" fill="#ffffff" stroke="#57606a"/>
  <text x="210" y="178" text-anchor="middle" font-size="12" fill="#24292f">INT16 = 2B</text>
  <rect x="270" y="156" width="100" height="34" fill="#ffffff" stroke="#57606a"/>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="#24292f">INT32 = 4B</text>
  <rect x="380" y="156" width="100" height="34" fill="#ffffff" stroke="#57606a"/>
  <text x="430" y="178" text-anchor="middle" font-size="12" fill="#24292f">INT64 = 8B</text>
  <text x="500" y="178" font-size="11" fill="#57606a">存 1 万个 int16 只要 20KB，换成 hashtable 要几百 KB</text>

  <!-- 升级过程 -->
  <text x="60" y="236" font-size="14" font-weight="bold" fill="#24292f">② 升级（upgrade）：插入超出当前范围的整数时整表换编码</text>

  <rect x="60" y="250" width="800" height="40" fill="#fff4e5" stroke="#b06000"/>
  <text x="76" y="267" font-size="12" font-weight="bold" fill="#b06000">场景：当前是 INT16，插入 40000（超出 int16 的 ±32767）</text>
  <text x="600" y="267" font-size="11" fill="#24292f">1 → 计算新编码　2 → 重新分配　3 → 从后往前搬　4 → 插入并保持有序</text>

  <!-- before -->
  <text x="60" y="316" font-size="12" font-weight="bold" fill="#24292f">升级前（INT16，每格 2 字节）</text>
  <g>
    <rect x="60" y="326" width="70" height="34" fill="#ffffff" stroke="#57606a"/>
    <text x="95" y="348" text-anchor="middle" font-size="12" fill="#24292f">1</text>
    <rect x="130" y="326" width="70" height="34" fill="#ffffff" stroke="#57606a"/>
    <text x="165" y="348" text-anchor="middle" font-size="12" fill="#24292f">5</text>
    <rect x="200" y="326" width="70" height="34" fill="#ffffff" stroke="#57606a"/>
    <text x="235" y="348" text-anchor="middle" font-size="12" fill="#24292f">9</text>
    <rect x="270" y="326" width="70" height="34" fill="#ffffff" stroke="#57606a"/>
    <text x="305" y="348" text-anchor="middle" font-size="12" fill="#24292f">100</text>
  </g>
  <text x="356" y="348" font-size="11" fill="#57606a">共 8 字节</text>

  <line x1="450" y1="360" x2="450" y2="380" stroke="#1a73e8" marker-end="url(#isB)"/>
  <text x="460" y="374" font-size="11" fill="#1a73e8">upgrade</text>

  <!-- after -->
  <text x="60" y="410" font-size="12" font-weight="bold" fill="#24292f">升级后（INT32，每格 4 字节）</text>
  <g>
    <rect x="60" y="420" width="70" height="34" fill="#e6f4ea" stroke="#188038"/>
    <text x="95" y="442" text-anchor="middle" font-size="12" fill="#188038">1</text>
    <rect x="130" y="420" width="70" height="34" fill="#e6f4ea" stroke="#188038"/>
    <text x="165" y="442" text-anchor="middle" font-size="12" fill="#188038">5</text>
    <rect x="200" y="420" width="70" height="34" fill="#e6f4ea" stroke="#188038"/>
    <text x="235" y="442" text-anchor="middle" font-size="12" fill="#188038">9</text>
    <rect x="270" y="420" width="70" height="34" fill="#e6f4ea" stroke="#188038"/>
    <text x="305" y="442" text-anchor="middle" font-size="12" fill="#188038">100</text>
    <rect x="340" y="420" width="90" height="34" fill="#fce8e6" stroke="#d93025"/>
    <text x="385" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#d93025">40000</text>
  </g>
  <text x="446" y="442" font-size="11" fill="#57606a">共 20 字节（插在末尾，比它大的元素本来没有）</text>
  <text x="446" y="458" font-size="11" fill="#d93025">搬移从后往前，避免覆盖还未搬的元素</text>

  <!-- 底部 -->
  <rect x="60" y="466" width="800" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="482" font-size="11" fill="#d93025">只升不降：用过 INT64 后即使把大元素删光也不会退回 INT16；SADD 一个字符串则直接整体转 hashtable</text>
</svg>
