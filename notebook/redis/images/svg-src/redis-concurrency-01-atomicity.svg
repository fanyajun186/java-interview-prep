<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">单线程下的并发安全：四层手段，各管一件事</text>

  <defs>
    <marker id="gB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="gR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
  </defs>

  <!-- 层 0 -->
  <rect x="40" y="56" width="820" height="82" rx="10" fill="#e6f4ea" stroke="#188038"/>
  <rect x="60" y="74" width="110" height="46" rx="6" fill="#ffffff" stroke="#188038"/>
  <text x="115" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">第 0 层</text>
  <text x="190" y="94" font-size="14" font-weight="bold" fill="#24292f">单条命令天然原子 —— 什么都不用做</text>
  <text x="190" y="116" font-size="12" fill="#24292f">命令串行执行，读-改-写不会被打断：INCR / DECR / HINCRBY / SETNX / SET key val NX EX / GETSET</text>
  <text x="190" y="134" font-size="12" fill="#57606a">选型原则：能用一条自带命令解决的，不要写 Lua，更不要用分布式锁</text>

  <!-- 层 1 -->
  <rect x="40" y="148" width="820" height="132" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="164" width="110" height="46" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="115" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">第 1 层</text>
  <text x="190" y="184" font-size="14" font-weight="bold" fill="#24292f">多条命令要原子 —— Lua 脚本（首选）</text>
  <text x="190" y="206" font-size="12" fill="#24292f">整段脚本作为一个命令执行，执行期间不插入任何其他客户端的命令，天然互斥</text>

  <rect x="190" y="218" width="330" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="204" y="238" font-size="11" fill="#24292f">local s = redis.call('get', KEYS[1])</text>
  <text x="204" y="254" font-size="11" fill="#24292f">if tonumber(s) &gt; 0 then return redis.call('decr', KEYS[1]) end</text>
  <text x="204" y="266" font-size="11" fill="#57606a">return 0</text>

  <rect x="540" y="218" width="300" height="50" rx="6" fill="#fef7e0" stroke="#b06000"/>
  <text x="554" y="238" font-size="12" fill="#b06000">红线：禁止死循环 / 大循环 / 长时间阻塞</text>
  <text x="554" y="258" font-size="12" fill="#b06000">脚本卡住 = 整个实例卡住，只能 SCRIPT KILL</text>

  <!-- 层 2 -->
  <rect x="40" y="290" width="820" height="118" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="306" width="110" height="46" rx="6" fill="#fef7e0" stroke="#b06000"/>
  <text x="115" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">第 2 层</text>
  <text x="190" y="326" font-size="14" font-weight="bold" fill="#24292f">MULTI / EXEC 事务 —— 只打包，不回滚（知道为什么不用它）</text>
  <text x="190" y="348" font-size="12" fill="#24292f">入队时语法错 → 整个事务被拒；执行时运行错（如对 String 做 LPUSH）→ 错的那条失败，其余照常生效，不回滚</text>
  <text x="190" y="370" font-size="12" fill="#24292f">没有隔离级别；WATCH 提供乐观锁（CAS），监控的 key 被改则 EXEC 返回 nil，由客户端重试</text>
  <text x="190" y="392" font-size="12" fill="#57606a">和 Lua 的关系：Lua 能拿到中间结果做判断，事务做不到，所以生产优先 Lua</text>

  <!-- 层 3 -->
  <rect x="40" y="418" width="820" height="118" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="60" y="434" width="110" height="46" rx="6" fill="#fce8e6" stroke="#d93025"/>
  <text x="115" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">第 3 层</text>
  <text x="190" y="454" font-size="14" font-weight="bold" fill="#24292f">跨进程 / 跨实例互斥 —— 分布式锁</text>
  <text x="190" y="476" font-size="12" fill="#24292f">加锁：SET lock:order:1 &lt;uuid&gt; NX EX 30（一条命令同时搞定「不存在才设」+「过期时间」）</text>
  <text x="190" y="496" font-size="12" fill="#d93025">红线：绝不能 SETNX lock 后再单独 EXPIRE，两条命令之间存在进程崩溃 → 死锁的窗口</text>
  <text x="190" y="516" font-size="12" fill="#24292f">解锁：Lua 先比对 uuid 再 DEL（直接 DEL 会误删别人的锁）；续期：Redisson 看门狗默认 30 s 锁每 10 s 续一次</text>

  <!-- 层 4 -->
  <rect x="40" y="546" width="820" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="570" font-size="13" font-weight="bold" fill="#24292f">第 4 层（性能层）：单实例 CPU 打满之后怎么办</text>
  <text x="60" y="592" font-size="12" fill="#24292f">主从读写分离摊读压力；Cluster 按 16384 槽分片摊写压力</text>
  <text x="60" y="612" font-size="12" fill="#24292f">同时规避阻塞源：KEYS / SMEMBERS / HGETALL 大集合、大 key 删除、FLUSHALL、长 Lua、fork</text>
</svg>
