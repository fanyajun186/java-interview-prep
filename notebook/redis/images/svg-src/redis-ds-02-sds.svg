<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">SDS 结构与 String 的三种编码</text>

  <!-- 上半：SDS 结构 -->
  <text x="60" y="66" font-size="14" font-weight="bold" fill="#24292f">① sdshdr8 的内存布局（头部 5 种：sdshdr5/8/16/32/64，按长度选最小头）</text>

  <g>
    <rect x="60" y="82" width="120" height="46" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="120" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">len</text>
    <text x="120" y="124" text-anchor="middle" font-size="10" fill="#57606a">已用长度</text>

    <rect x="180" y="82" width="120" height="46" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="240" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">alloc</text>
    <text x="240" y="124" text-anchor="middle" font-size="10" fill="#57606a">分配总量</text>

    <rect x="300" y="82" width="80" height="46" fill="#fef7e0" stroke="#b06000"/>
    <text x="340" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06000">flags</text>
    <text x="340" y="124" text-anchor="middle" font-size="10" fill="#57606a">头类型</text>

    <rect x="380" y="82" width="300" height="46" fill="#e6f4ea" stroke="#188038"/>
    <text x="530" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">buf[]</text>
    <text x="530" y="124" text-anchor="middle" font-size="10" fill="#57606a">真实字节，末尾仍补 \0 兼容 C 函数</text>

    <text x="120" y="146" text-anchor="middle" font-size="10" fill="#57606a">1 字节</text>
    <text x="240" y="146" text-anchor="middle" font-size="10" fill="#57606a">1 字节</text>
    <text x="340" y="146" text-anchor="middle" font-size="10" fill="#57606a">1 字节</text>
    <text x="530" y="146" text-anchor="middle" font-size="10" fill="#57606a">alloc + 1</text>
  </g>

  <rect x="60" y="158" width="820" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="180" font-size="12" fill="#24292f">扩容：新长度 &lt; 1MB 时多分配一倍；≥ 1MB 时多分配 1MB —— 把 N 次 realloc 摊成少量几次</text>
  <text x="76" y="200" font-size="12" fill="#24292f">惰性释放：缩短时不立刻回收，差额记在 alloc − len 里，下次写入直接复用</text>

  <!-- 下半：三种编码 -->
  <text x="60" y="242" font-size="14" font-weight="bold" fill="#24292f">② 同一个 String 类型的三种编码</text>

  <!-- int -->
  <rect x="60" y="258" width="250" height="130" rx="8" fill="#ffffff" stroke="#188038"/>
  <text x="185" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">int</text>
  <text x="185" y="304" text-anchor="middle" font-size="12" fill="#24292f">值是 long 范围内的整数</text>
  <rect x="90" y="316" width="190" height="34" fill="#e6f4ea" stroke="#188038"/>
  <text x="185" y="338" text-anchor="middle" font-size="12" fill="#188038">ptr 直接当整型用</text>
  <text x="185" y="368" text-anchor="middle" font-size="11" fill="#57606a">零 SDS 开销，INCR 天然高效</text>

  <!-- embstr -->
  <rect x="325" y="258" width="250" height="130" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="450" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">embstr（≤ 44 字节）</text>
  <text x="450" y="304" text-anchor="middle" font-size="12" fill="#24292f">robj 与 SDS 一次分配成连续内存</text>
  <rect x="345" y="316" width="210" height="34" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#1a73e8">[ redisObject ][ sdshdr ][ buf ]</text>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="#d93025">只读：改一次即转 raw，不可回退</text>

  <!-- raw -->
  <rect x="590" y="258" width="290" height="130" rx="8" fill="#ffffff" stroke="#b06000"/>
  <text x="735" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">raw（&gt; 44 字节）</text>
  <text x="735" y="304" text-anchor="middle" font-size="12" fill="#24292f">robj 与 SDS 分两次分配</text>
  <rect x="620" y="316" width="100" height="34" fill="#fff4e5" stroke="#b06000"/>
  <text x="670" y="338" text-anchor="middle" font-size="11" fill="#b06000">redisObject</text>
  <text x="735" y="338" text-anchor="middle" font-size="14" fill="#b06000">→</text>
  <rect x="760" y="316" width="100" height="34" fill="#fff4e5" stroke="#b06000"/>
  <text x="810" y="338" text-anchor="middle" font-size="11" fill="#b06000">SDS</text>
  <text x="735" y="368" text-anchor="middle" font-size="11" fill="#57606a">大 JSON 走这条，容易抬高碎片率</text>

  <!-- 44 字节算式 -->
  <rect x="60" y="404" width="820" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="428" font-size="13" font-weight="bold" fill="#24292f">③ 边界为什么是 44 字节（高频追问）</text>
  <rect x="90" y="440" width="120" height="30" fill="#f6f8fa" stroke="#57606a"/>
  <text x="150" y="460" text-anchor="middle" font-size="12" fill="#24292f">64（分配粒度）</text>
  <text x="222" y="460" font-size="14" fill="#57606a">−</text>
  <rect x="234" y="440" width="120" height="30" fill="#f6f8fa" stroke="#57606a"/>
  <text x="294" y="460" text-anchor="middle" font-size="12" fill="#24292f">16（robj）</text>
  <text x="366" y="460" font-size="14" fill="#57606a">−</text>
  <rect x="378" y="440" width="120" height="30" fill="#f6f8fa" stroke="#57606a"/>
  <text x="438" y="460" text-anchor="middle" font-size="12" fill="#24292f">3（sdshdr8）</text>
  <text x="510" y="460" font-size="14" fill="#57606a">−</text>
  <rect x="522" y="440" width="100" height="30" fill="#f6f8fa" stroke="#57606a"/>
  <text x="572" y="460" text-anchor="middle" font-size="12" fill="#24292f">1（\0）</text>
  <text x="634" y="460" font-size="14" fill="#57606a">=</text>
  <rect x="646" y="440" width="90" height="30" fill="#e6f4ea" stroke="#188038"/>
  <text x="691" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">44 字节</text>
  <text x="76" y="482" font-size="11" fill="#57606a">jemalloc 分配粒度是 64 字节，embstr 一次分配要塞得下 robj + sdshdr + 数据，剩下 44 字节给内容</text>

  <!-- 底部 -->
  <rect x="60" y="500" width="820" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="522" font-size="12" font-weight="bold" fill="#24292f">生产排查</text>
  <text x="76" y="542" font-size="12" fill="#24292f">· MEMORY USAGE key + OBJECT ENCODING key 先看编码再看内存</text>
  <text x="76" y="558" font-size="12" fill="#d93025">· SETRANGE / APPEND 一次就退化成 raw 且不可逆；0~9999 整数走共享对象池（refcount 复用）</text>
</svg>
